name: Publish Current Launcher

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/publish-current-launcher.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-current-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-current-launcher
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Read release metadata
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$(grep -E '^\s*versionCode\s+' app/build.gradle | head -1 | sed -E 's/.*versionCode\s+([0-9]+).*/\1/')
          VERSION_NAME=$(grep -E '^\s*versionName\s+' app/build.gradle | head -1 | sed -E 's/.*versionName\s+"([^"]+)".*/\1/')
          test "$VERSION_CODE" -ge 326
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_name=DLavie26-Launcher-v${VERSION_CODE}.apk" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace --console=plain

      - name: Sign and verify release APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE"
          echo "$SIGNING_KEYSTORE" | base64 -d > /tmp/dlavie.keystore
          APK_FILE=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          test -s "$APK_FILE"
          mkdir -p release
          "${ANDROID_HOME}/build-tools/36.0.0/zipalign" -f -p 4 "$APK_FILE" /tmp/aligned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" sign \
            --ks /tmp/dlavie.keystore \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass "pass:$SIGNING_KEYSTORE_PASSWORD" \
            --key-pass "pass:$SIGNING_KEY_PASSWORD" \
            --out "release/$APK_NAME" \
            /tmp/aligned.apk
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify --verbose --print-certs "release/$APK_NAME"
          test $(stat -c%s "release/$APK_NAME") -gt 1000000
          rm -f /tmp/dlavie.keystore /tmp/aligned.apk

      - name: Replace asset in data release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DATA_TOKEN: ${{ secrets.DLAVIE_DATA_TOKEN }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          test -n "$DATA_TOKEN"
          AUTH=(-H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" \
            'https://api.github.com/repos/drmacze/DLavie-Launcher-Data/releases/tags/v26' > /tmp/release.json
          RELEASE_ID=$(python3 -c "import json; print(json.load(open('/tmp/release.json'))['id'])")
          UPLOAD_URL=$(python3 -c "import json; print(json.load(open('/tmp/release.json'))['upload_url'].split('{')[0])")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" \
            "https://api.github.com/repos/drmacze/DLavie-Launcher-Data/releases/${RELEASE_ID}/assets?per_page=100" > /tmp/assets.json
          ASSET_ID=$(python3 - "$APK_NAME" <<'PY'
          import json, sys
          name = sys.argv[1]
          for asset in json.load(open('/tmp/assets.json')):
              if asset.get('name') == name:
                  print(asset['id'])
                  break
          PY
          )
          if [ -n "$ASSET_ID" ]; then
            curl --fail-with-body --silent --show-error -X DELETE "${AUTH[@]}" \
              "https://api.github.com/repos/drmacze/DLavie-Launcher-Data/releases/assets/${ASSET_ID}"
          fi
          curl --fail-with-body --silent --show-error -X POST "${AUTH[@]}" \
            -H 'Content-Type: application/vnd.android.package-archive' \
            --data-binary "@release/$APK_NAME" \
            "${UPLOAD_URL}?name=${APK_NAME}" > /tmp/uploaded.json
          python3 - "$APK_NAME" <<'PY'
          import json, sys
          uploaded = json.load(open('/tmp/uploaded.json'))
          if uploaded.get('name') != sys.argv[1] or not uploaded.get('browser_download_url'):
              raise SystemExit(f'Asset upload failed: {uploaded}')
          print(uploaded['browser_download_url'])
          PY

      - name: Update public manifest atomically
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          DATA_TOKEN: ${{ secrets.DLAVIE_DATA_TOKEN }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          AUTH=(-H "Authorization: Bearer $DATA_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          curl --fail-with-body --silent --show-error "${AUTH[@]}" \
            'https://api.github.com/repos/drmacze/DLavie-Launcher-Data/contents/manifest.json?ref=main' > /tmp/manifest-source.json
          python3 - "$VERSION_CODE" "$VERSION_NAME" "$APK_NAME" <<'PY'
          import base64, datetime, json, sys
          version_code = int(sys.argv[1])
          version_name = sys.argv[2]
          apk_name = sys.argv[3]
          source = json.load(open('/tmp/manifest-source.json'))
          manifest = json.loads(base64.b64decode(source['content']).decode())
          manifest['updated_at'] = datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          launcher = manifest.setdefault('launcher', {})
          launcher['latest_version_code'] = version_code
          launcher['latest_version_name'] = version_name
          launcher['apk_url'] = f'https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v26/{apk_name}'
          note = f'v{version_name}: Portal account SSO and reliable Google login (v{version_code})'
          notes = [note] + [item for item in launcher.get('release_notes', []) if item != note]
          launcher['release_notes'] = notes[:8]
          json.dump(manifest, open('/tmp/manifest.json', 'w'), indent=2, ensure_ascii=False)
          open('/tmp/manifest.sha', 'w').write(source['sha'])
          PY
          CONTENT=$(base64 -w0 /tmp/manifest.json)
          SHA=$(cat /tmp/manifest.sha)
          python3 - "$CONTENT" "$SHA" "$VERSION_CODE" > /tmp/update-payload.json <<'PY'
          import json, sys
          print(json.dumps({
              'message': f'chore(manifest): publish launcher v{sys.argv[3]}',
              'content': sys.argv[1],
              'sha': sys.argv[2],
              'branch': 'main',
          }))
          PY
          curl --fail-with-body --silent --show-error -X PUT "${AUTH[@]}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/update-payload.json \
            'https://api.github.com/repos/drmacze/DLavie-Launcher-Data/contents/manifest.json' > /tmp/manifest-update.json
          python3 - <<'PY'
          import json
          result = json.load(open('/tmp/manifest-update.json'))
          if not result.get('commit', {}).get('sha'):
              raise SystemExit(f'Manifest update failed: {result}')
          print(result['commit']['sha'])
          PY

      - name: Verify published manifest and APK
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_NAME: ${{ steps.version.outputs.apk_name }}
        run: |
          set -euo pipefail
          sleep 5
          curl --fail --silent --show-error \
            "https://raw.githubusercontent.com/drmacze/DLavie-Launcher-Data/main/manifest.json?ts=$(date +%s)" > /tmp/live-manifest.json
          python3 - "$VERSION_CODE" "$APK_NAME" <<'PY'
          import json, sys
          manifest = json.load(open('/tmp/live-manifest.json'))
          launcher = manifest['launcher']
          if launcher.get('latest_version_code') != int(sys.argv[1]):
              raise SystemExit(f'Wrong live version: {launcher}')
          if not launcher.get('apk_url', '').endswith('/' + sys.argv[2]):
              raise SystemExit(f'Wrong APK URL: {launcher}')
          print(launcher['apk_url'])
          PY
          curl --fail --location --silent --show-error --range 0-1023 \
            "https://github.com/drmacze/DLavie-Launcher-Data/releases/download/v26/${APK_NAME}" > /tmp/apk-prefix.bin
          test $(stat -c%s /tmp/apk-prefix.bin) -gt 0

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ steps.version.outputs.version_code }}-${{ github.event_name }}
          path: ${{ github.event_name == 'pull_request' && 'app/build/outputs/apk/debug/*.apk' || 'release/*.apk' }}
          if-no-files-found: error

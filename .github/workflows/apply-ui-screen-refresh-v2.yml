name: Apply DLavie Screen Refresh V2

on:
  push:
    branches: [main]
    paths:
      - 'app/src/main/java/com/drmacze/f16launcher/TapTapComponents.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/ModernUI.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/DlcScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/SettingsScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/GameDetailScreen.kt'
      - '.github/scripts/apply_ui_screen_refresh_v2.py'
      - '.github/workflows/apply-ui-screen-refresh-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/drmacze/f16launcher/TapTapComponents.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/ModernUI.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/DlcScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/SettingsScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/GameDetailScreen.kt'
      - '.github/scripts/apply_ui_screen_refresh_v2.py'
      - '.github/workflows/apply-ui-screen-refresh-v2.yml'

permissions:
  contents: write

concurrency:
  group: screen-refresh-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate refresh script syntax
        run: python -m py_compile .github/scripts/apply_ui_screen_refresh_v2.py

      - name: Apply screen refresh
        run: python .github/scripts/apply_ui_screen_refresh_v2.py

      - name: Validate visual invariants
        shell: bash
        run: |
          set -euo pipefail
          BASE='app/src/main/java/com/drmacze/f16launcher'
          for file in TapTapComponents.kt ModernUI.kt DlcScreen.kt SettingsScreen.kt GameDetailScreen.kt; do
            grep -F '// DLAVIE_SCREEN_REFRESH_V2' "$BASE/$file"
          done
          grep -F 'modifier = Modifier.fillMaxWidth().height(196.dp)' "$BASE/TapTapComponents.kt"
          grep -F 'if (isSelected) TextWhite else TextWhite.copy(alpha = 0.18f)' "$BASE/TapTapComponents.kt"
          grep -F 'containerColor: Color = TextWhite' "$BASE/ModernUI.kt"
          grep -F 'private val DlcCardBg    get() = GlassBase' "$BASE/DlcScreen.kt"
          grep -F 'Launcher, penyimpanan, keamanan, dan akun' "$BASE/SettingsScreen.kt"
          grep -F 'Text("Mainkan"' "$BASE/GameDetailScreen.kt"
          grep -F 'Text("Install Game"' "$BASE/GameDetailScreen.kt"
          ! grep -F 'Console-style redesign (PS5/Xbox inspired)' "$BASE/GameDetailScreen.kt"

      - name: Commit materialized UI source
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          FILES=(
            app/src/main/java/com/drmacze/f16launcher/TapTapComponents.kt
            app/src/main/java/com/drmacze/f16launcher/ModernUI.kt
            app/src/main/java/com/drmacze/f16launcher/DlcScreen.kt
            app/src/main/java/com/drmacze/f16launcher/SettingsScreen.kt
            app/src/main/java/com/drmacze/f16launcher/GameDetailScreen.kt
          )
          if git diff --quiet -- "${FILES[@]}"; then
            echo 'DLavie screen refresh is already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FILES[@]}"
          git commit -m 'chore(ui): materialize DLavie screen refresh v2'
          git push

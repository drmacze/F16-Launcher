name: Apply Portal Connect Redesign

on:
  push:
    branches:
      - feat/v329-clean-portal-connect
      - feat/v330-guided-portal-connect
      - main
    paths:
      - 'app/src/main/java/com/drmacze/f16launcher/PortalConnectScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/PortalSsoActivity.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/DLavieGuidedActivity.kt'
      - 'app/build.gradle'
      - '.github/scripts/apply_portal_connect_redesign.py'
      - '.github/workflows/apply-portal-connect-redesign.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/drmacze/f16launcher/PortalConnectScreen.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/PortalSsoActivity.kt'
      - 'app/src/main/java/com/drmacze/f16launcher/DLavieGuidedActivity.kt'
      - 'app/build.gradle'
      - '.github/scripts/apply_portal_connect_redesign.py'
      - '.github/workflows/apply-portal-connect-redesign.yml'

permissions:
  contents: write

concurrency:
  group: portal-connect-redesign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic Portal patch
        run: python3 .github/scripts/apply_portal_connect_redesign.py

      - name: Validate guided Portal experience
        shell: bash
        run: |
          set -euo pipefail
          GUIDED='app/src/main/java/com/drmacze/f16launcher/DLavieGuidedActivity.kt'
          SCREEN='app/src/main/java/com/drmacze/f16launcher/PortalConnectScreen.kt'
          SSO='app/src/main/java/com/drmacze/f16launcher/PortalSsoActivity.kt'
          VERSION_CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          VERSION_NAME=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -ge 330
          test -n "$VERSION_NAME"
          grep -F 'ProfessionalPortalConnectContent(' "$GUIDED"
          grep -F 'Hubungkan akun DLavie Anda dengan aman.' "$GUIDED"
          grep -F 'AppUpdateChecker.checkForUpdate(context = context)' "$SCREEN"
          grep -F 'LocaleText.get(context, "portal.step_login")' "$SCREEN"
          grep -F 'LocaleText.get(context, "portal.step_approve")' "$SCREEN"
          grep -F 'LocaleText.get(context, "portal.step_return")' "$SCREEN"
          grep -F 'LocaleText.get(context, "portal.start")' "$SCREEN"
          grep -F 'PortalConnectStage.WAITING_PORTAL' "$SSO"
          grep -F 'LocaleText.get(this, "portal.verify_code")' "$SSO"
          grep -F 'LocaleText.get(this@PortalSsoActivity, "portal.connected")' "$SSO"
          grep -F 'private fun reopenPortal()' "$SSO"
          grep -F 'PORTAL_SSO_CALLBACK_URL' "$SSO"
          ! grep -F 'Update to Latest Version' "$GUIDED"
          ! grep -F 'Download & Install' "$GUIDED"
          ! grep -F 'v$latestVersionName' "$GUIDED"
          ! grep -F 'api.github.com/repos/drmacze/F16-Launcher/releases/latest' "$GUIDED"
          ! grep -F 'Token Portal tidak pernah dikirim melalui tautan.' "$SSO"

      - name: Commit materialized source
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- app/src/main/java/com/drmacze/f16launcher/DLavieGuidedActivity.kt; then
            echo 'Portal source already materialized.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/drmacze/f16launcher/DLavieGuidedActivity.kt
          git commit -m 'feat: apply guided Portal connection experience'
          git push
